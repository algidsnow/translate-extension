<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gemini Vocab Helper</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      font-size: 13px;
    }

    /* ===== HEADER ===== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid #2a2a4a;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #c4b5fd;
    }
    .app-title .logo {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900; color: white;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .icon-btn {
      background: #1e1e3a;
      border: 1px solid #3b3b5c;
      color: #a78bfa;
      border-radius: 7px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: #2d2d52; color: #c4b5fd; }
    .icon-btn.danger { color: #f87171; border-color: #5c2626; }
    .icon-btn.danger:hover { background: #3a1c1c; color: #fca5a5; }

    /* ===== TABS ===== */
    .tab-bar {
      display: flex;
      background: #12121f;
      border-bottom: 1px solid #2a2a4a;
    }
    .tab-btn {
      flex: 1; padding: 8px 0;
      background: none; border: none;
      color: #6b7280; font-size: 12px; font-weight: 500;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .tab-btn.active { color: #a78bfa; border-bottom-color: #7c3aed; }
    .tab-btn:hover:not(.active) { color: #9ca3af; }

    /* ===== VIEWS ===== */
    .view { display: none; }
    .view.active { display: block; }

    /* ===== SETTINGS VIEW ===== */
    .settings-view {
      padding: 16px 14px;
    }
    .settings-section {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .settings-section-title {
      font-weight: 600;
      font-size: 12px;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #3b3b5c;
      border-radius: 7px;
      padding: 7px 10px;
      color: #e0e0f0;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: #7c3aed; }
    .form-input::placeholder { color: #4b4b6b; }
    .hint-text {
      font-size: 10px;
      color: #6b7280;
      margin-top: 3px;
    }
    .hint-text a { color: #a78bfa; text-decoration: none; }
    .hint-text a:hover { text-decoration: underline; }

    .save-settings-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      padding: 9px;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .save-settings-btn:hover { opacity: 0.85; }

    .settings-saved-msg {
      text-align: center;
      color: #34d399;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    /* ===== API STATUS BADGE ===== */
    .api-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .api-status.ok { background: #064e3b; color: #34d399; }
    .api-status.missing { background: #450a0a; color: #f87171; }

    /* ===== VOCAB VIEW ===== */
    .vocab-view { padding: 0; }
    .search-panel {
      padding: 10px 12px 0;
      border-bottom: 1px solid #22223a;
    }
    .search-row {
      display: flex;
      gap: 6px;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      background: #0f0f1a;
      border: 1px solid #3b3b5c;
      border-radius: 7px;
      padding: 8px 10px;
      color: #e0e0f0;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }
    .search-input:focus { border-color: #7c3aed; }
    .search-input::placeholder { color: #4b4b6b; }
    .search-btn {
      width: 38px;
      border: none;
      border-radius: 7px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }
    .search-results {
      display: none;
      padding: 8px 0 2px;
    }
    .search-results.show { display: block; }
    .search-status {
      color: #6b7280;
      font-size: 11px;
      padding: 2px 0 8px;
    }
    .suggestion-item {
      background: #151527;
      border: 1px solid #2a2a4a;
      border-left: 3px solid #22c55e;
      border-radius: 8px;
      padding: 9px 9px 8px 11px;
      margin-bottom: 8px;
      position: relative;
    }
    .suggestion-main-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-right: 58px;
    }
    .suggestion-word {
      color: #bbf7d0;
      font-weight: 700;
      font-size: 13px;
    }
    .suggestion-add-btn {
      position: absolute;
      top: 7px;
      right: 7px;
      border: none;
      border-radius: 7px;
      background: #064e3b;
      color: #86efac;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
    }
    .suggestion-add-btn:hover { background: #065f46; }
    .suggestion-add-btn:disabled {
      opacity: 0.75;
      cursor: default;
    }
    #vocabContainer {
      max-height: 420px;
      overflow-y: auto;
      padding: 10px 12px;
    }
    #vocabContainer::-webkit-scrollbar { width: 4px; }
    #vocabContainer::-webkit-scrollbar-track { background: transparent; }
    #vocabContainer::-webkit-scrollbar-thumb { background: #3b3b5c; border-radius: 2px; }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #4b4b6b;
    }
    .empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }
    .empty-state p { font-size: 12px; line-height: 1.5; }

    /* ===== WORD ITEM ===== */
    .word-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-left: 3px solid #7c3aed;
      padding: 10px 10px 8px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      position: relative;
      transition: border-color 0.15s;
    }
    .word-item:hover { border-left-color: #a78bfa; }
    .word-item.related-word {
      border-left-color: #d97706;
      background: #1c1a10;
      margin-left: 14px;
    }
    .word-item.related-word:hover { border-left-color: #f59e0b; }

    .word-actions {
      position: absolute;
      top: 6px; right: 6px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .tts-word-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      line-height: 1;
      transition: transform 0.15s;
    }
    .tts-word-btn:hover { transform: scale(1.25); }
    .delete-btn {
      background: #3a1c1c;
      color: #f87171;
      border: none;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .delete-btn:hover { background: #5c2626; }

    .word-main-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-right: 50px;
    }
    .original {
      font-weight: 700;
      font-size: 14px;
      color: #c4b5fd;
    }
    .ipa {
      color: #6b7280;
      font-style: italic;
      font-size: 11px;
    }
    .related-badge {
      background: #78350f;
      color: #fcd34d;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 8px;
    }
    .word-type {
      background: #1e1b4b;
      color: #818cf8;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      display: inline-block;
      margin: 3px 0;
    }
    .translated {
      color: #d1d5db;
      margin-top: 3px;
      font-size: 13px;
    }
    .example-text {
      color: #6b7280;
      font-size: 11px;
      font-style: italic;
      margin-top: 3px;
      border-left: 2px solid #3b3b5c;
      padding-left: 6px;
    }
    .related-to-text {
      font-size: 9px;
      color: #6b7280;
      margin-top: 3px;
    }
    .date {
      font-size: 10px;
      color: #4b4b6b;
      text-align: right;
      margin-top: 4px;
    }

    /* ===== TOGGLE RELATED ===== */
    .toggle-related {
      background: none; border: none;
      color: #d97706; font-size: 11px;
      cursor: pointer; padding: 3px 0;
      display: flex; align-items: center; gap: 4px;
      font-family: 'Inter', sans-serif;
    }
    .toggle-related:hover { color: #f59e0b; }
    .toggle-related .arrow { transition: transform 0.2s; display: inline-block; }
    .toggle-related.expanded .arrow { transform: rotate(90deg); }
    .related-group { overflow: hidden; }
    .related-group.collapsed { display: none; }

    /* ===== KNOWLEDGE PANEL ===== */
    .knowledge-panel { display: none; }
    .knowledge-panel.show { display: block; }
    .k-topic {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      margin: 10px 12px 6px;
      overflow: hidden;
    }
    .k-topic-header {
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      color: #c4b5fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .k-topic-header:hover { background: #22223a; }
    .k-topic-header .k-arrow { transition: transform 0.2s; font-size: 10px; color: #6b7280; }
    .k-topic.open .k-arrow { transform: rotate(90deg); }
    .k-topic-body { display: none; padding: 0 12px 10px; }
    .k-topic.open .k-topic-body { display: block; }
    .k-section {
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-left: 3px solid;
    }
    .k-section.noun { background: #0d1b3e; border-color: #3b82f6; }
    .k-section.verb { background: #0d2e1a; border-color: #22c55e; }
    .k-section.adj  { background: #2d1a00; border-color: #f59e0b; }
    .k-section.adv  { background: #1e0d2e; border-color: #a855f7; }
    .k-section.tense-red    { background: #2d0f0f; border-color: #ef4444; }
    .k-section.tense-green  { background: #0d2e1a; border-color: #22c55e; }
    .k-section.tense-blue   { background: #0d1b3e; border-color: #3b82f6; }
    .k-section.tense-purple { background: #1e0d2e; border-color: #a855f7; }
    .k-title { font-weight: 700; font-size: 11px; color: #e0e0f0; margin-bottom: 4px; }
    .k-title .k-icon { margin-right: 3px; }
    .k-row { font-size: 11px; color: #9ca3af; margin: 2px 0; }
    .k-row.k-ex { font-style: italic; color: #6b7280; font-size: 10px; margin: 0 0 4px 14px; }
    .k-row.k-ex b { color: #d1d5db; font-style: normal; }
    .k-formula { font-family: monospace; font-size: 10px; color: #a78bfa; background: rgba(124,58,237,0.1); padding: 1px 4px; border-radius: 3px; }
    .k-divider { font-size: 10px; color: #6b7280; margin: 6px 0 4px; font-weight: 600; }

    /* ===== LOADING STATE ===== */
    .loading-state {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 12px;
    }
    .mini-spinner {
      width: 20px; height: 20px;
      border: 2px solid #3b3b5c;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== NO API KEY BANNER ===== */
    .no-api-banner {
      margin: 12px;
      background: #1c0d2e;
      border: 1px solid #4c1d95;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .no-api-banner .banner-icon { font-size: 28px; margin-bottom: 6px; }
    .no-api-banner h4 { color: #c4b5fd; font-size: 13px; margin-bottom: 4px; }
    .no-api-banner p { color: #6b7280; font-size: 11px; line-height: 1.5; margin-bottom: 10px; }
    .go-settings-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 7px;
      color: white;
      font-weight: 600;
      font-size: 12px;
      padding: 7px 16px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="app-header">
    <div class="app-title">
      <div class="logo">G</div>
      Vocab Helper
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="knowledgeBtn">📚</button>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
      <button class="icon-btn danger" id="clearBtn">🗑️</button>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="vocab">📖 Từ Vựng</button>
    <button class="tab-btn" data-tab="settings">⚙️ Cài Đặt</button>
  </div>

  <!-- KNOWLEDGE PANEL (inside vocab tab) -->
  <div id="knowledgePanel" class="knowledge-panel"></div>

  <!-- VOCAB VIEW -->
  <div class="view active vocab-view" id="vocabView">
    <div class="search-panel">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="Nhập từ/cụm từ cần tìm...">
        <button class="search-btn" id="searchBtn" title="Tìm kiếm">🔎</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div id="vocabContainer">
      <div class="loading-state">
        <div class="mini-spinner"></div>
        <div>Đang tải...</div>
      </div>
    </div>
  </div>

  <!-- SETTINGS VIEW -->
  <div class="view settings-view" id="settingsView">
    <div class="settings-section">
      <div class="settings-section-title">🦙 Ollama (Local AI)</div>
      <div class="form-group">
        <label class="form-label">Ollama URL</label>
        <input type="text" class="form-input" id="ollamaUrlInput" placeholder="http://localhost:11434">
        <div class="hint-text">Mặc định: <code>http://localhost:11434</code></div>
      </div>
      <div class="form-group">
        <label class="form-label">Model</label>
        <input type="text" class="form-input" id="ollamaModelInput" placeholder="gemma4:31b-cloud">
        <div class="hint-text">Tên model đã pull trong Ollama (ví dụ: <code>gemma4:31b-cloud</code>, <code>llama3</code>)</div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">☁️ Supabase Cloud</div>
      <div class="form-group">
        <label class="form-label">Supabase Project URL</label>
        <input type="text" class="form-input" id="supabaseUrlInput" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="form-group">
        <label class="form-label">Supabase Anon Key</label>
        <input type="password" class="form-input" id="supabaseKeyInput" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        <div class="hint-text">Lấy tại Supabase Dashboard → Settings → API. Cần tạo bảng <code>vocab_words</code> và tắt RLS.</div>
      </div>
    </div>

    <button class="save-settings-btn" id="saveSettingsBtn">💾 Lưu Cài Đặt</button>
    <div class="settings-saved-msg" id="savedMsg">✅ Đã lưu thành công!</div>
  </div>

  <script src="knowledge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
